name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest,   name: macos-universal }
    steps:
      - uses: actions/checkout@v4

      - name: Install raylib system dependencies
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ matrix.name }}" = "macos-universal" ]; then
            EXTRA='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install to staging folder
        run: cmake --install build --config Release --prefix dist/PotatoEngine

      - name: Package
        shell: bash
        working-directory: dist
        run: |
          cmake -E tar cf "../PotatoEngine-${GITHUB_REF_NAME}-${{ matrix.name }}.zip" \
            --format=zip PotatoEngine

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: "*.zip"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
